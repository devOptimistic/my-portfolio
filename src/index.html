<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>Mohammad Javad Bayatani</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#c8002d" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      /* Apply the saved language/theme before first paint to avoid a flash. */
      (function () {
        try {
          var d = document.documentElement;
          var l = localStorage.getItem('resume-lang');
          if (l === 'fa' || l === 'en') {
            d.lang = l;
            d.dir = l === 'fa' ? 'rtl' : 'ltr';
          }
          var t = localStorage.getItem('resume-theme');
          if (t === 'light' || t === 'dark') {
            d.setAttribute('data-theme', t);
          }
        } catch (e) {
          /* storage unavailable */
        }
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
